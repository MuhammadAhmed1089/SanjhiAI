<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sanjhi-logo.png" />
    <link rel="apple-touch-icon" href="/sanjhi-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanjhi — Community Savings</title>

    <!-- Preconnect for faster DNS + TLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking font load (media trick: loads async, swaps to all on load) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Material Symbols — restricted weight range to reduce payload -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet" />
    </noscript>

    <style>
      /* ── Sanjhi Ultra-Smooth Dashboard-Themed Splash Screen ── */
      #splash-root {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
        user-select: none;
        will-change: opacity, transform;
      }
      #splash-root.hiding {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      #splash-root.hidden {
        display: none;
      }

      /* Ambient Dashboard Background */
      .splash-ambient-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .splash-dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1.5px 1.5px, rgba(0, 105, 114, 0.28) 1.2px, transparent 1.2px);
        background-size: 28px 28px;
        opacity: 0.65;
      }
      .splash-blob-1 {
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        background: rgba(0, 105, 114, 0.08);
        filter: blur(80px);
        top: -120px;
        left: -120px;
        animation: splash-float-blob 8s ease-in-out infinite alternate;
      }
      .splash-blob-2 {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: rgba(212, 175, 55, 0.09);
        filter: blur(80px);
        bottom: -80px;
        right: -80px;
        animation: splash-float-blob 9s ease-in-out infinite alternate-reverse;
      }
      @keyframes splash-float-blob {
        0%   { transform: translateY(0px) scale(1); }
        100% { transform: translateY(30px) scale(1.08); }
      }

      /* Watermark Logo Background */
      .splash-watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 420px;
        max-width: 80vw;
        opacity: 0.035;
        pointer-events: none;
        user-select: none;
        filter: brightness(0) saturate(100%) invert(26%) sepia(85%) saturate(1450%) hue-rotate(152deg);
      }

      /* Central Card */
      .splash-card {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 36px 32px 32px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1.5px solid rgba(0, 105, 114, 0.14);
        box-shadow: 0 24px 60px -15px rgba(0, 105, 114, 0.12), 0 4px 16px rgba(0, 0, 0, 0.03);
        max-width: 90vw;
        width: 360px;
      }

      /* Logo container */
      .splash-logo-wrap {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        animation: splash-pop-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes splash-pop-in {
        from { opacity: 0; transform: scale(0.8) translateY(12px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }

      /* Pulsing ring behind logo */
      .splash-ring {
        position: absolute;
        inset: -8px;
        border-radius: 2rem;
        border: 2px solid rgba(0, 105, 114, 0.22);
        animation: splash-ring-pulse 2.4s ease-in-out infinite;
      }
      .splash-ring-outer {
        position: absolute;
        inset: -16px;
        border-radius: 2.25rem;
        border: 1.5px solid rgba(0, 105, 114, 0.1);
        animation: splash-ring-pulse 2.4s ease-in-out infinite 0.4s;
      }
      @keyframes splash-ring-pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }

      /* Logo bg box */
      .splash-logo-bg {
        width: 92px;
        height: 92px;
        border-radius: 1.75rem;
        background: #ffffff;
        border: 2px solid rgba(0, 105, 114, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 32px rgba(0, 105, 114, 0.15), 0 2px 6px rgba(0, 0, 0, 0.04);
        padding: 12px;
      }
      .splash-logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* Brand text with generous line spacing */
      .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        animation: splash-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
      }
      @keyframes splash-fade-up {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .splash-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 28px;
        font-weight: 800;
        color: #006972;
        letter-spacing: -0.02em;
        line-height: 1.25;
        margin-bottom: 2px;
      }
      .splash-urdu {
        font-family: 'Noto Nastaliq Urdu', serif;
        font-size: 24px;
        font-weight: 700;
        color: #0D1B2A;
        line-height: 1.6;
        margin-bottom: 4px;
      }
      .splash-tagline {
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: #006972;
        opacity: 0.75;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        line-height: 1.5;
        margin-bottom: 20px;
      }

      /* Centered Progress Section */
      .splash-loader-section {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        animation: splash-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
      }

      /* Progress Bar (Centered, not at bottom) */
      .splash-progress-track {
        width: 100%;
        max-width: 220px;
        height: 6px;
        border-radius: 99px;
        background: rgba(0, 105, 114, 0.12);
        overflow: hidden;
        border: 1px solid rgba(0, 105, 114, 0.1);
        position: relative;
      }
      .splash-progress-bar {
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #006972, #10b981, #d4af37, #006972);
        background-size: 250% 100%;
        animation: splash-progress 2.4s cubic-bezier(0.4, 0, 0.2, 1) both,
                   splash-progress-shimmer 1.4s linear infinite;
      }
      @keyframes splash-progress {
        0%   { width: 0%; }
        60%  { width: 75%; }
        100% { width: 100%; }
      }
      @keyframes splash-progress-shimmer {
        0%   { background-position: 250% 0; }
        100% { background-position: -250% 0; }
      }

      /* Status badge */
      .splash-status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 99px;
        background: rgba(0, 105, 114, 0.07);
        border: 1px solid rgba(0, 105, 114, 0.14);
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 11px;
        font-weight: 600;
        color: #006972;
        letter-spacing: 0.02em;
      }
      .splash-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        animation: splash-dot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-dot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.7); }
      }
    </style>
  </head>
  <body>
    <!-- ── Sanjhi Splash Screen — Dashboard Themed & Original Logo ── -->
    <div id="splash-root" role="status" aria-label="Loading Sanjhi">
      <!-- Ambient Background Elements -->
      <div class="splash-ambient-bg">
        <div class="splash-dots"></div>
        <div class="splash-blob-1"></div>
        <div class="splash-blob-2"></div>
        <img src="/sanjhi-logo.png" alt="" aria-hidden="true" class="splash-watermark" />
      </div>

      <!-- Main Floating Glass Card -->
      <div class="splash-card">
        <div class="splash-logo-wrap">
          <div class="splash-ring"></div>
          <div class="splash-ring-outer"></div>
          <div class="splash-logo-bg">
            <img src="/sanjhi-logo.png" alt="Sanjhi Logo" class="splash-logo-img" />
          </div>
        </div>

        <div class="splash-brand">
          <div class="splash-name">Sanjhi</div>
          <div class="splash-urdu">سانجھی</div>
          <div class="splash-tagline">Community Savings · Trusted Pools</div>
        </div>

        <!-- Centered Loading Indicator -->
        <div class="splash-loader-section">
          <div class="splash-progress-track">
            <div class="splash-progress-bar"></div>
          </div>
          <div class="splash-status-badge">
            <span class="splash-status-dot"></span>
            <span>Securing Session...</span>
          </div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
